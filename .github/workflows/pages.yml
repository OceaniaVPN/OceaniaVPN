name: Deploy static theme pages to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static frontend only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/temi

          # Publish only the gallery and the six self-contained HTML themes.
          cp index.html _site/index.html
          for theme in beach forest gori ocean pustinya site; do
            test -s "temi/${theme}.html"
            cp "temi/${theme}.html" "_site/temi/${theme}.html"
          done

          # Keep Worker code, configuration, migrations, and user data out of Pages.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
