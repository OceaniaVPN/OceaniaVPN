name = "steklovpnzloy-bot"
main = "src/index.js"
compatibility_date = "2026-08-16"

[build]
command = "npm install"

[vars]
CONFIG_REPO_OWNER = "OceaniaVPN"
CONFIG_REPO_NAME = "StekloVPN"
BOT_REPO_OWNER = "OceaniaVPN"
BOT_REPO_NAME = "OceaniaVPN"
CONFIGS_FOLDER = "configs"
BRANCH = "main"
WORKER_ORIGIN = "https://phantom-crete-zloy.novogodniysait.workers.dev"

[[kv_namespaces]]
binding = "Phantom"
id = "9cd886e5451344adad3954471020aab9"

[[d1_databases]]
binding = "BOT_DB"
# Existing D1 identity is retained; deploy provisioning validates/reuses it before creating a replacement.
database_name = "kakok"
database_id = "ab045d2b-9499-4862-b44d-ff83e589591c"
migrations_dir = "migrations"
# Deployment trigger: 2026-10-03T20:12:11.410Z


[triggers]
crons = ["* * * * *", "0 * * * *"]
